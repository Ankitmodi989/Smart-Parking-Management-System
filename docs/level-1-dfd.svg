<svg viewBox="0 0 1300 1000" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1300" height="1000" fill="#ffffff"/>
  <text x="650" y="24" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Level 1 DFD</text>
  <text x="650" y="43" text-anchor="middle" font-size="13" fill="#555">Smart Parking Management System (SPMS)</text>

  <!-- ===== Flow lines (drawn first, so labels + backgrounds sit on top) ===== -->
  <!-- 1: Driver -> 1.0 -->
  <line x1="160" y1="165" x2="242" y2="165" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <!-- 2: 1.0 -> Driver -->
  <line x1="242" y1="197" x2="160" y2="197" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <!-- 3: 1.0 <-> D1 -->
  <line x1="360" y1="175" x2="470" y2="175" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)" marker-start="url(#arrow1)"/>
  <!-- 4: Driver -> 2.0 -->
  <path d="M 90 210 L 90 395 L 242 395" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <!-- 5: 2.0 -> Driver -->
  <path d="M 242 445 L 65 445 L 65 210" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <!-- 6: 2.0 <-> D2 -->
  <line x1="360" y1="415" x2="470" y2="415" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)" marker-start="url(#arrow1)"/>
  <!-- 7: 2.0 -> D3 -->
  <path d="M 335 480 L 335 630 L 470 630" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <!-- 8: Sensor -> 3.0 -->
  <path d="M 100 860 L 100 780 L 242 780" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <!-- 9: 3.0 <-> D3 -->
  <path d="M 300 680 L 300 655 L 470 655" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)" marker-start="url(#arrow1)"/>
  <!-- 10: 3.0 -> 4.0 -->
  <path d="M 355 775 L 700 775 L 700 610" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <!-- 11: 4.0 <-> D4 -->
  <path d="M 780 620 L 780 720 L 900 720" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)" marker-start="url(#arrow1)"/>
  <!-- 12: 4.0 -> Payment Gateway -->
  <line x1="820" y1="605" x2="1140" y2="605" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <!-- 13: Payment Gateway -> 4.0 -->
  <line x1="1140" y1="650" x2="820" y2="650" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <!-- 14: 4.0 -> Driver (receipt) -->
  <path d="M 750 500 L 750 100 L 160 100 L 160 152" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <!-- 15: D3 -> 5.0 (booking data) -->
  <path d="M 640 620 L 640 300 L 842 260" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <!-- 16: D4 -> 5.0 (payment data) -->
  <path d="M 995 700 L 995 330 L 900 315" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <!-- 17: 5.0 -> Admin (reports) -->
  <path d="M 900 215 L 900 130 L 1210 130 L 1210 152" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <!-- 18: 5.0 -> Driver (notifications) -->
  <path d="M 855 210 L 855 75 L 90 75 L 90 152" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <!-- ===== External entities ===== -->
  <rect x="20" y="150" width="140" height="60" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="90" y="185" text-anchor="middle" font-size="14" font-weight="bold">Driver</text>

  <rect x="20" y="860" width="160" height="60" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="100" y="882" text-anchor="middle" font-size="14" font-weight="bold">Sensor /</text>
  <text x="100" y="900" text-anchor="middle" font-size="14" font-weight="bold">ANPR Camera</text>

  <rect x="1140" y="150" width="140" height="60" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="1210" y="185" text-anchor="middle" font-size="14" font-weight="bold">Admin</text>

  <rect x="1140" y="600" width="140" height="60" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="1210" y="622" text-anchor="middle" font-size="14" font-weight="bold">Payment</text>
  <text x="1210" y="640" text-anchor="middle" font-size="14" font-weight="bold">Gateway</text>

  <!-- ===== Processes ===== -->
  <circle cx="300" cy="180" r="60" fill="#e8f0fe" stroke="#1a56db" stroke-width="2.2"/>
  <text x="300" y="172" text-anchor="middle" font-size="12.5" font-weight="bold">1.0</text>
  <text x="300" y="188" text-anchor="middle" font-size="11.5">Manage Login /</text>
  <text x="300" y="202" text-anchor="middle" font-size="11.5">Registration</text>

  <circle cx="300" cy="420" r="60" fill="#e8f0fe" stroke="#1a56db" stroke-width="2.2"/>
  <text x="300" y="412" text-anchor="middle" font-size="12.5" font-weight="bold">2.0</text>
  <text x="300" y="428" text-anchor="middle" font-size="11.5">Search &amp; Reserve</text>
  <text x="300" y="442" text-anchor="middle" font-size="11.5">Slot</text>

  <circle cx="300" cy="740" r="60" fill="#e8f0fe" stroke="#1a56db" stroke-width="2.2"/>
  <text x="300" y="732" text-anchor="middle" font-size="12.5" font-weight="bold">3.0</text>
  <text x="300" y="748" text-anchor="middle" font-size="11.5">Detect Entry /</text>
  <text x="300" y="762" text-anchor="middle" font-size="11.5">Exit</text>

  <circle cx="760" cy="560" r="60" fill="#e8f0fe" stroke="#1a56db" stroke-width="2.2"/>
  <text x="760" y="552" text-anchor="middle" font-size="12.5" font-weight="bold">4.0</text>
  <text x="760" y="568" text-anchor="middle" font-size="11.5">Process Payment</text>
  <text x="760" y="582" text-anchor="middle" font-size="11.5">&amp; Billing</text>

  <circle cx="900" cy="260" r="60" fill="#e8f0fe" stroke="#1a56db" stroke-width="2.2"/>
  <text x="900" y="252" text-anchor="middle" font-size="12.5" font-weight="bold">5.0</text>
  <text x="900" y="268" text-anchor="middle" font-size="11.5">Notifications</text>
  <text x="900" y="282" text-anchor="middle" font-size="11.5">&amp; Reports</text>

  <!-- ===== Data stores ===== -->
  <g>
    <line x1="470" y1="160" x2="470" y2="200" stroke="#065f46" stroke-width="2"/>
    <line x1="470" y1="160" x2="640" y2="160" stroke="#065f46" stroke-width="2"/>
    <line x1="470" y1="200" x2="640" y2="200" stroke="#065f46" stroke-width="2"/>
    <text x="483" y="185" font-size="12" font-weight="bold" fill="#065f46">D1  User Data</text>
  </g>

  <g>
    <line x1="470" y1="400" x2="470" y2="440" stroke="#065f46" stroke-width="2"/>
    <line x1="470" y1="400" x2="640" y2="400" stroke="#065f46" stroke-width="2"/>
    <line x1="470" y1="440" x2="640" y2="440" stroke="#065f46" stroke-width="2"/>
    <text x="483" y="425" font-size="12" font-weight="bold" fill="#065f46">D2  Slot Data</text>
  </g>

  <g>
    <line x1="470" y1="620" x2="470" y2="660" stroke="#065f46" stroke-width="2"/>
    <line x1="470" y1="620" x2="660" y2="620" stroke="#065f46" stroke-width="2"/>
    <line x1="470" y1="660" x2="660" y2="660" stroke="#065f46" stroke-width="2"/>
    <text x="480" y="645" font-size="12" font-weight="bold" fill="#065f46">D3  Booking Data</text>
  </g>

  <g>
    <line x1="900" y1="700" x2="900" y2="740" stroke="#065f46" stroke-width="2"/>
    <line x1="900" y1="700" x2="1090" y2="700" stroke="#065f46" stroke-width="2"/>
    <line x1="900" y1="740" x2="1090" y2="740" stroke="#065f46" stroke-width="2"/>
    <text x="912" y="725" font-size="12" font-weight="bold" fill="#065f46">D4  Payment Data</text>
  </g>

  <!-- ===== Flow labels (drawn last, own white backing, offset clear of every line) ===== -->
  <rect x="163" y="145" width="80" height="14" fill="#ffffff"/>
  <text x="168" y="157" font-size="11">credentials</text>

  <rect x="163" y="200" width="80" height="14" fill="#ffffff"/>
  <text x="168" y="212" font-size="11">auth status</text>

  <rect x="378" y="158" width="80" height="14" fill="#ffffff"/>
  <text x="383" y="170" font-size="11">user data</text>

  <rect x="98" y="373" width="150" height="14" fill="#ffffff"/>
  <text x="103" y="385" font-size="11">search / booking request</text>

  <rect x="78" y="423" width="170" height="14" fill="#ffffff"/>
  <text x="83" y="435" font-size="11">availability / confirmation</text>

  <rect x="378" y="398" width="70" height="14" fill="#ffffff"/>
  <text x="383" y="410" font-size="11">slot data</text>

  <rect x="345" y="608" width="95" height="14" fill="#ffffff"/>
  <text x="350" y="620" font-size="11">create booking</text>

  <rect x="108" y="758" width="115" height="14" fill="#ffffff"/>
  <text x="113" y="770" font-size="11">entry / exit signal</text>

  <rect x="308" y="633" width="90" height="14" fill="#ffffff"/>
  <text x="313" y="645" font-size="11">update status</text>

  <rect x="440" y="782" width="160" height="14" fill="#ffffff"/>
  <text x="445" y="794" font-size="11">trigger fee calculation</text>

  <rect x="590" y="655" width="95" height="14" fill="#ffffff"/>
  <text x="595" y="667" font-size="11">payment record</text>

  <rect x="900" y="588" width="110" height="14" fill="#ffffff"/>
  <text x="905" y="600" font-size="11">payment request</text>

  <rect x="900" y="668" width="105" height="14" fill="#ffffff"/>
  <text x="905" y="680" font-size="11">payment status</text>

  <rect x="400" y="88" width="55" height="14" fill="#ffffff"/>
  <text x="405" y="100" font-size="11">receipt</text>

  <rect x="655" y="450" width="90" height="14" fill="#ffffff"/>
  <text x="660" y="462" font-size="11">booking data</text>

  <rect x="1000" y="500" width="90" height="14" fill="#ffffff"/>
  <text x="1005" y="512" font-size="11">payment data</text>

  <rect x="1030" y="118" width="55" height="14" fill="#ffffff"/>
  <text x="1035" y="130" font-size="11">reports</text>

  <rect x="440" y="62" width="90" height="14" fill="#ffffff"/>
  <text x="445" y="74" font-size="11">notifications</text>

  <!-- ===== Legend ===== -->
  <circle cx="55" cy="960" r="12" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/>
  <text x="80" y="965" font-size="12">Process</text>
  <rect x="160" y="948" width="16" height="16" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="185" y="960" font-size="12">External Entity</text>
  <line x1="320" y1="960" x2="345" y2="960" stroke="#065f46" stroke-width="2"/>
  <text x="355" y="965" font-size="12">Data Store</text>
</svg>
