<svg viewBox="0 0 1000 750" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1000" height="750" fill="#ffffff"/>

  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Context Diagram (Level 0 DFD)</text>
  <text x="500" y="49" text-anchor="middle" font-size="13" fill="#555">Smart Parking Management System (SPMS)</text>

  <!-- ===== Flow lines (orthogonal routing) ===== -->
  <!-- P1: Driver -> System (request) -->
  <path d="M 220 140 L 340 140 L 340 329 L 429 329" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- P2: System -> Driver (response) -->
  <path d="M 409 358 L 300 358 L 300 170 L 220 170" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- P3: Admin -> System (config) -->
  <path d="M 780 140 L 660 140 L 660 329 L 571 329" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- P4: System -> Admin (reports) -->
  <path d="M 591 358 L 700 358 L 700 170 L 780 170" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- P5: Sensor -> System (signal) -->
  <path d="M 240 600 L 340 600 L 340 471 L 429 471" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- P6: System -> Payment Gateway (payment request) -->
  <path d="M 571 471 L 660 471 L 660 600 L 760 600" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- P7: Payment Gateway -> System (payment status) -->
  <path d="M 760 630 L 700 630 L 700 442 L 591 442" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===== Central process ===== -->
  <circle cx="500" cy="400" r="100" fill="#e8f0fe" stroke="#1a56db" stroke-width="2.5"/>
  <text x="500" y="392" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">0</text>
  <text x="500" y="412" text-anchor="middle" font-size="14" fill="#1a1a1a">Smart Parking</text>
  <text x="500" y="430" text-anchor="middle" font-size="14" fill="#1a1a1a">Management System</text>

  <!-- ===== External entities ===== -->
  <rect x="40" y="120" width="180" height="70" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="130" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Driver</text>

  <rect x="780" y="120" width="180" height="70" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="870" y="160" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Admin</text>

  <rect x="40" y="580" width="200" height="70" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="140" y="610" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Sensor / ANPR</text>
  <text x="140" y="628" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Camera</text>

  <rect x="760" y="580" width="200" height="70" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="860" y="610" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Payment</text>
  <text x="860" y="628" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Gateway</text>

  <!-- ===== Flow labels (own white backing, clear of every line/box/circle) ===== -->
  <rect x="225" y="122" width="122" height="34" fill="#ffffff"/>
  <text x="230" y="134" font-size="12.5" fill="#1a1a1a">Login / Search /</text>
  <text x="230" y="149" font-size="12.5" fill="#1a1a1a">Booking Request</text>

  <rect x="345" y="253" width="255" height="18" fill="#ffffff"/>
  <text x="350" y="265" font-size="12.5" fill="#1a1a1a">Availability / Confirmation / Receipt</text>

  <rect x="655" y="122" width="120" height="34" fill="#ffffff"/>
  <text x="660" y="134" font-size="12.5" fill="#1a1a1a">Pricing Rules /</text>
  <text x="660" y="149" font-size="12.5" fill="#1a1a1a">Slot Config</text>

  <rect x="430" y="225" width="195" height="18" fill="#ffffff"/>
  <text x="435" y="237" font-size="12.5" fill="#1a1a1a">Occupancy / Revenue Reports</text>

  <rect x="245" y="580" width="112" height="34" fill="#ffffff"/>
  <text x="250" y="592" font-size="12.5" fill="#1a1a1a">Vehicle Entry /</text>
  <text x="250" y="607" font-size="12.5" fill="#1a1a1a">Exit Signal</text>

  <rect x="520" y="520" width="132" height="18" fill="#ffffff"/>
  <text x="525" y="532" font-size="12.5" fill="#1a1a1a">Payment Request</text>

  <rect x="710" y="520" width="128" height="18" fill="#ffffff"/>
  <text x="715" y="532" font-size="12.5" fill="#1a1a1a">Payment Status</text>

  <!-- ===== Legend ===== -->
  <rect x="40" y="690" width="18" height="18" fill="#e8f0fe" stroke="#1a56db" stroke-width="1.5"/>
  <text x="65" y="704" font-size="12.5" fill="#333">Process</text>
  <rect x="150" y="690" width="18" height="18" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="175" y="704" font-size="12.5" fill="#333">External Entity</text>
</svg>
